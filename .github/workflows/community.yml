name: Update community comments

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  build-community:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build community.json from open issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "community",
              per_page: 100
            });

            function parse(issue) {
              const body = issue.body || "";
              if (!body.includes("<!-- markdown-word-community -->")) return null;

              const name = (body.match(/^- 显示名:\s*(.+)$/m) || [,"匿名用户"])[1].trim();
              const rating = Number((body.match(/^- 评分:\s*([1-5])$/m) || [,5])[1]);
              const type = (body.match(/^- 类型:\s*(.+)$/m) || [,"留言"])[1].trim();
              const messageMatch = body.match(/### 留言\s*\n([\s\S]*?)(?:\n---|\s*$)/);
              const message = (messageMatch ? messageMatch[1] : "").trim();

              return {
                issue: issue.number,
                name,
                rating,
                type,
                message,
                url: issue.html_url,
                github_user: issue.user?.login || "",
                created_at: issue.created_at,
                updated_at: issue.updated_at
              };
            }

            const items = issues
              .filter(i => !i.pull_request)
              .map(parse)
              .filter(Boolean)
              .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

            fs.writeFileSync("docs/community.json", JSON.stringify(items, null, 2) + "\n");

      - name: Commit snapshot
        run: |
          if git diff --quiet -- docs/community.json; then
            echo "No community changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community.json
          git commit -m "chore: update community comments"
          git push
