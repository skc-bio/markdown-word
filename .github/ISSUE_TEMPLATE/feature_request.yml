name: Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      placeholder: 描述使用场景和目前的不便。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么做？
      placeholder: 描述理想的交互或功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他想法
