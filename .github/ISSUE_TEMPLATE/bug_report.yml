name: Bug report
description: 报告 Markdown Word 的错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可以复现问题的信息。
  - type: input
    id: version
    attributes:
      label: Markdown Word 版本
      placeholder: "例如 0.9.3"
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian 版本
      placeholder: "例如 1.13.x"
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 控制台错误
      description: 可以直接拖入图片，或粘贴 Console 报错。
